<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Page not found | SlateBiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: Inter, system-ui, sans-serif;
        color: #3a3a3a;
        background: #f7f8fc;
      }
      header {
        background: #fff;
        height: 80px;
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      header img { height: 36px; width: auto; display: block; }
      main {
        position: relative;
        overflow: hidden;
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 20px;
        text-align: center;
      }
      .glow {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 999px;
        filter: blur(60px);
        pointer-events: none;
      }
      .glow-blue { left: -80px; top: 24px; background: rgba(12, 105, 182, 0.08); }
      .glow-orange { right: -60px; bottom: 0; background: rgba(255, 100, 31, 0.07); }
      .card { position: relative; max-width: 560px; }
      .kicker {
        margin: 0;
        color: #0c69b6;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 0;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 500;
        font-size: 48px;
        line-height: 1.15;
        color: #0f172a;
      }
      p { margin: 16px auto 0; max-width: 420px; font-size: 16px; line-height: 1.6; color: #475569; }
      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 32px;
        height: 50px;
        padding: 0 32px;
        border-radius: 10px;
        background: #0c69b6;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .home:hover { background: #0a5a9c; }
      nav { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; }
      nav a { color: #475569; font-size: 14px; font-weight: 500; text-decoration: none; }
      nav a:hover { color: #0c69b6; }
      @media (min-width: 768px) {
        header { height: 96px; padding: 0 32px; }
        header img { height: 50px; }
        h1 { font-size: 52px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a id="logo-link" href="https://www.slatebiz.com/">
        <img id="logo" src="/logo.webp" alt="SlateBiz" width="180" height="50" />
      </a>
    </header>
    <main>
      <div class="glow glow-blue"></div>
      <div class="glow glow-orange"></div>
      <div class="card">
        <p class="kicker">404</p>
        <h1>Page not found</h1>
        <p>This address is not a page on SlateBiz, JewelBiz, or CuraBiz.</p>
        <a class="home" id="home" href="https://www.slatebiz.com/">Back to home</a>
        <nav aria-label="Helpful pages">
          <a href="https://www.slatebiz.com/">SlateBiz</a>
          <a href="https://www.jewelbiz.in/">JewelBiz</a>
          <a href="https://www.curabiz.in/">CuraBiz</a>
          <a href="https://www.slatebiz.com/blogs/">Blog</a>
          <a href="https://www.slatebiz.com/contact/">Contact</a>
        </nav>
      </div>
    </main>
    <script>
      const host = location.hostname.toLowerCase().replace(/^www\./, '');
      const home = document.getElementById('home');
      const logoLink = document.getElementById('logo-link');
      const logo = document.getElementById('logo');
      if (host === 'jewelbiz.in') {
        home.href = 'https://www.jewelbiz.in/';
        logoLink.href = home.href;
        logo.src = '/jewelbiz-logo.png';
        logo.alt = 'JewelBiz';
      } else if (host === 'curabiz.in') {
        home.href = 'https://www.curabiz.in/';
        logoLink.href = home.href;
        logo.src = '/curabiz-logo.png';
        logo.alt = 'CuraBiz';
      }
    </script>
  </body>
</html>
